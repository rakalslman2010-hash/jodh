<html lang="ar" dir="rtl">
<head>

<style>
:root{--g:#1d5a39;--g2:#2c7a52;--gd:#123a25;--gold:#b8923a;--bg:#f4f6f2;--sf:#fff;--tx:#17251d;--mt:#66756c;--ln:#e0e6df;--ok:#1d7a4a;--yl:#c99a16;--or:#d9731f;--bad:#b3402f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root{--g:#3f9a6b;--g2:#57b383;--gd:#0f2a1c;--gold:#d4ae5a;--bg:#0e1612;--sf:#17221b;--tx:#e8efe9;--mt:#93a69a;--ln:#263329;--ok:#5cc58b;--yl:#e0b93c;--or:#f08a3c;--bad:#e5806f;color-scheme:dark}}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--gd);z-index:50}
.app{max-width:600px;margin:0 auto;padding-bottom:100px}
header.top{background:var(--gd);color:#fff;padding:16px 18px 20px;border-radius:0 0 26px 26px;display:flex;align-items:center;gap:12px}
header.top img{width:44px;height:44px;border-radius:12px}
header.top h1{margin:0;font-size:19px;font-weight:800}
header.top p{margin:0;font-size:12px;opacity:.75}
.chip{margin-inline-start:auto;font-size:12px;background:rgba(255,255,255,.12);padding:4px 10px;border-radius:99px;white-space:nowrap}
.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9aa;margin-inline-end:6px}
.chip.ok i{background:#5cd58b}.chip.err i{background:#f08a3c}
main{padding:16px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:16px;margin-bottom:12px}
a.card{display:block;color:inherit;text-decoration:none}
.hero{background:linear-gradient(160deg,var(--g),var(--gd));color:#fff;border:0}
.hero h2{margin:0 0 4px;font-size:21px;font-weight:800}.hero p{margin:0 0 14px;opacity:.85;font-size:14px}
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 18px;background:var(--gold);color:#1b1608;width:100%;font-size:16px;cursor:pointer;text-align:center;text-decoration:none;display:block}
.btn.alt{background:transparent;color:var(--g);border:1.5px solid var(--g)}
.btn.del{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn.sm{width:auto;padding:7px 12px;font-size:14px;display:inline-block}
.btn:active{transform:scale(.98)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{text-align:center;padding:12px 4px;margin:0}.stat b{display:block;font-size:24px;font-weight:800;color:var(--g)}.stat span{font-size:12px;color:var(--mt)}
.rk{text-align:center;padding:10px 4px;margin:0;border-radius:14px;color:#fff;font-weight:800;font-size:22px;line-height:1.2}.rk small{display:block;font-size:11px;font-weight:500;opacity:.95}
h3{margin:0 0 10px;font-size:17px}
label.f{display:block;font-size:13px;color:var(--mt);margin:0 0 4px}
input[type=text],input[type=password],input[type=date],input[type=number],input[type=url],textarea,select{width:100%;font:inherit;font-size:16px;color:var(--tx);background:var(--bg);border:1.5px solid var(--ln);border-radius:12px;padding:10px 12px;margin-bottom:12px}
input:focus,textarea:focus,select:focus,button:focus-visible,a:focus-visible{outline:2.5px solid var(--gold);outline-offset:1px}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--gd);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.sticky .big{font-size:22px;color:var(--gold)}.sticky small{opacity:.8;font-weight:500;margin-inline-start:8px}
.it{padding:12px 0;border-top:1px solid var(--ln)}.it:first-of-type{border-top:0}
.it .q{display:flex;justify-content:space-between;gap:10px;font-size:15px;font-weight:500}.it .v{font-weight:800;color:var(--g);white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--g);height:34px;direction:ltr;margin:4px 0 0}
.sh{display:flex;justify-content:space-between;align-items:baseline}.sh em{font-style:normal;color:var(--mt);font-size:13px}.note{color:var(--mt);font-size:13px;margin:-6px 0 6px}
.hi{display:flex;justify-content:space-between;align-items:center;gap:10px}.hi small{color:var(--mt)}
.pc{font-weight:800;font-size:20px;min-width:56px;text-align:left}.pc small{font-size:12px}
.empty{text-align:center;color:var(--mt);padding:26px 10px}
.res{text-align:center}.ring{width:150px;height:150px;margin:4px auto 10px;position:relative}.ring svg{transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:grid;place-content:center;font-size:34px;font-weight:800;text-align:center}.ring small{font-size:13px;color:var(--mt);font-weight:500}
.tag{display:inline-block;padding:4px 14px;border-radius:99px;color:#fff;font-weight:700;font-size:14px}
.bars{display:flex;gap:6px;align-items:flex-end;height:110px;margin-top:8px}.bar{flex:1;max-width:44px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:11px;font-weight:700}.bar i{display:block;width:100%;border-radius:6px 6px 0 0;min-height:3px}
details{border-top:1px solid var(--ln);padding:8px 0}summary{cursor:pointer;font-weight:700;display:flex;justify-content:space-between}
.row{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}.row input{margin:0}
.sig{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:12px;text-align:center;color:var(--mt)}.sig div{border-top:1px solid var(--ln);padding-top:6px;margin-top:26px}
.kb{display:inline-block;padding:1px 9px;border-radius:99px;font-size:11px;font-weight:700;vertical-align:middle;white-space:nowrap}.kb.adm{background:var(--g);color:#fff}.kb.edu{background:var(--gold);color:#1b1608}.kb.old{background:var(--ln);color:var(--mt)}.kb.wt{background:var(--or);color:#fff}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--ln);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:40}
nav.tabs div{display:flex;max-width:600px;margin:0 auto}
nav.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--mt);font-size:11px;font-weight:700;padding:5px 0;border-radius:12px}
nav.tabs svg{display:block;margin:0 auto 2px;width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a.on{color:var(--g)}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--gd);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:60}
.fab{position:fixed;bottom:84px;inset-inline-start:16px;z-index:35}
.dfix{background:var(--bg);border:1.5px dashed var(--ln);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-weight:700;color:var(--mt)}
nav.tabs a{position:relative}.nb{position:absolute;top:0;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10px;min-width:16px;height:16px;line-height:16px;border-radius:99px;padding:0 4px;display:none}.nb.on{display:block}
@media print{nav.tabs,.sticky,.noprint,body::before,.fab{display:none!important}.card{break-inside:avoid}}
</style>
</head>
<body>
<div class="app">
<header class="top"><img src="icon-192.png" alt=""><div><h1>جودة الحلقات</h1><p>الجمعية الخيرية لتحفيظ القرآن الكريم في جلاجل</p></div><span class="chip" id="chip"><i></i><span>محلي</span></span></header>
<div id="view"></div>
</div>
<nav class="tabs" id="tabs"><div>
<a href="#home" data-t="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>الرئيسية</a>
<a href="#tasks" data-t="tasks"><svg viewBox="0 0 24 24"><path d="M9 4h6v3H9zM7 5H5v16h14V5h-2M9 14l2 2 4-4"/></svg>المهام<b class="nb" id="nb"></b></a>
<a href="#halaqat" data-t="halaqat"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.5 3-6 6-6s6 2.5 6 6M16 5a3 3 0 010 6M18 14c2 .7 3 2.6 3 6"/></svg>الحلقات</a>

</div></nav>
<script>
/* ضع رابط قاعدة Firebase هنا مرة واحدة فقط (يحفظ البيانات على الإنترنت لتصل لكل الأجهزة حتى لو غير متصلة وقت التعديل).
   مثال: "https://my-app-default-rtdb.firebaseio.com"  — اتركه فارغاً للاتصال المباشر بين الأجهزة فقط. */
var FIREBASE_URL="https://a123-1b8a2-default-rtdb.europe-west1.firebasedatabase.app";

(function(){
var V=document.getElementById("view");
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function arr(x){return Array.isArray(x)?x.filter(Boolean):x&&typeof x==="object"?Object.keys(x).sort(function(a,b){return a-b}).map(function(k){return x[k]}):[]}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function sum(a){return a.reduce(function(x,y){return x+y},0)}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmt(d){try{return new Date(d+"T00:00:00").toLocaleDateString("ar-u-ca-gregory",{day:"numeric",month:"long",year:"numeric"})}catch(e){return d}}
function toast(m){var t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2200)}
function ask(msg,ok){var o=document.createElement("div");o.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px";
 o.innerHTML='<div class="card" style="max-width:340px;width:100%;margin:0"><p style="margin:0 0 16px;font-weight:700;line-height:1.7">'+esc(msg)+'</p><div class="g2"><button class="btn del" data-m="y">تأكيد</button><button class="btn alt" data-m="n">إلغاء</button></div></div>';
 o.addEventListener("click",function(e){var m=e.target.dataset.m;if(m||e.target===o){o.remove();if(m==="y"){ok();toast("تم")}}});document.body.appendChild(o)}
function lsGet(){try{return JSON.parse(localStorage.getItem("jh2"))||{}}catch(e){return{}}}
function lsSet(){try{localStorage.setItem("jh2",JSON.stringify({room:P.room,name:P.name,me:P.me}))}catch(e){}}

/* ===== البنود الافتراضية (من النموذجين) ===== */
var TEACH=["التمكن العالي من التسميع ومتابعة النص بدقة (غيباً / نظراً)","القدرة على اكتشاف الأخطاء الفورية ومعالجتها دون تأخير","جودة وسرعة تصحيح أحكام التجويد والأخطاء الجلية والخفية","العدالة والمساواة بين الطلاب في الاهتمام ووقت التسميع","سرعة وحيوية إدارة الحلقة ومنع حدوث أي فراغ أو فوضى","متابعة جميع الطلاب المشاركين والمنتظرين بشكل مستمر","القدرة على ضبط الحلقة وفرض الهيبة بأسلوب تربوي راقٍ","التحفيز والتشجيع الفعال والمناسب لطبيعة ومستوى كل طالب","جودة الخطة اليومية ووضوح الأهداف المرتجاة للدرس","شخصية المعلم القيادية، هيبته، وتأثيره الإيجابي على الطلاب"];
var TEST=["جودة الحفظ الأساسي للمقاطع المقررة حديثاً","الطلاقة وسلاسة التلاوة وخلوها من التعثر","التطبيق العملي السليم لأحكام التجويد ومخارج الحروف","ضبط بداية الآيات ونهاياتها دون لبس","الربط السليم بين المقاطع والسور المترابطة","السؤال المفاجئ من المحفوظ القديم والمراجعة العامة"];
var ENV=["بدء الحلقة في الوقت المحدد بدقة وانضباط الطلاب","تجهيز البيئة التعليمية (نظافة، إضاءة، ترتيب، تهوية)","الاستثمار الأمثل لوقت الحلقة وخلوها من الهدر والانتظار","الانضباط العام والاحترام المتبادل داخل البيئة التعليمية","التنظيم العام وتوزيع الأركان والمجموعات داخل الحلقة"];
function mk(id,title,note,max,step,list,inPct){return{id:id,title:title,note:note,inPct:inPct,items:list.map(function(t,i){return{id:id+"_"+i,t:t,max:max,step:step}})}}
function defCfg(){return{sections:[
mk("a","كفاءة المعلم والأداء الميداني","",4,1,TEACH,true),
mk("b","الاختبار المفاجئ «معيار الحقيقة»","يختار المشرف 2-3 طلاب عشوائياً",10,1,TEST,true),
mk("c","جودة الحلقات والبيئة التعليمية","",4,1,ENV,true),
mk("d","مطابقة السجلات والتوثيق","السجلات المفحوصة: الحضور، التسميع، الدرجات، الخطة، الغياب",20,10,["مطابقة الواقع الفعلي للسجلات: كاملة (20) / جزئية (10) / اختلاف (0)"],true),
mk("e","مؤشرات التميز","طالب متقن / ابتكار / وسيلة / انضباط فائق (خارج النسبة)",10,1,["تقدير التميز"],false)]}}
/* ===== جهتا التقييم: إدارة المجمع (نموذج 1) والشؤون التعليمية (نموذج 2) ===== */
var GM="المدير العام<br>عبدالعزيز بن عبد الإله الرزقان",CM="مدير المجمع<br>ماجد بن إبراهيم العمران";
var KINDS={adm:{n:"إدارة المجمع",sig:["المشرف",CM,GM]},edu:{n:"الشؤون التعليمية",sig:["المشرف",GM]},old:{n:"تقييم مدمج (قديم)",sig:["المشرف",CM,GM]}};
var DK={a:"edu",b:"edu",c:"adm",d:"adm",e:"adm"};
function kd(v){return v&&(v.kind==="adm"||v.kind==="edu")?v.kind:"old"}
function kb(k){return '<span class="kb '+k+'">'+KINDS[k].n+'</span>'}
function sigH(k){var g=KINDS[k].sig;return '<div class="sig" style="grid-template-columns:repeat('+g.length+',1fr)">'+g.map(function(x){return '<div>'+x+'</div>'}).join("")+'</div>'}
var VF="all",CK="adm";
function nc(c){c=c||defCfg();return{sections:arr(c.sections).map(function(s){return{id:s.id,k:s.k||DK[s.id]||"adm",title:s.title||"",note:s.note||"",inPct:s.inPct!==false,items:arr(s.items).map(function(i){return{id:i.id,t:i.t||"",max:+i.max||0,step:+i.step||1}})}})}}

/* ===== الحالة والمزامنة (برقم الغرفة فقط، اتصال مباشر بين الأجهزة) ===== */
var P=lsGet(),legacy=P.c;delete P.c;delete P.q;delete P.url;
var S={halaqat:{},visits:{},supervisors:{},tasks:{},cfg:nc()};
var M={},ST="",TXT="",F={},R=[],peer=null,conns=[],hostConn=null,isHost=false,retryT=null;
var SYNCED=false;
var busy={new:1,hedit:1,sedit:1,cfg:1,setup:1,tedit:1,login:1,settings:1,t:1};
function persist(){}
function online(){return !!P.room}
function setSt(k,t){if(k==="ok"){SYNCED=true;setTimeout(checkNotify,0)}if(k!==undefined&&k!==null)ST=k;if(t!==undefined)TXT=t;var c=document.getElementById("chip");if(!c)return;c.className="chip "+(P.room?ST:"");c.lastChild.textContent=!P.room?"محلي":(TXT||"جارٍ الاتصال…")}
function rebuild(){var n={halaqat:{},visits:{},supervisors:{},tasks:{},cfg:null};Object.keys(M).forEach(function(k){var e=M[k];if(!e||e.v===null||e.v===undefined)return;if(k==="cfg"){n.cfg=e.v}else{var i=k.indexOf("/"),g=k.slice(0,i),id=k.slice(i+1);if(n[g])n[g][id]=e.v}});S={halaqat:n.halaqat,visits:n.visits,supervisors:n.supervisors,tasks:n.tasks,cfg:nc(n.cfg)}}
function mk_(){return "jh-m-"+P.room}
function saveM(){try{localStorage.setItem(mk_(),JSON.stringify(M))}catch(e){}}
function loadM(){try{M=JSON.parse(localStorage.getItem(mk_())||"{}")||{}}catch(e){M={}}
 if(!Object.keys(M).length&&legacy&&(Object.keys(legacy.halaqat||{}).length||Object.keys(legacy.visits||{}).length)){
  Object.keys(legacy.halaqat||{}).forEach(function(k){M["halaqat/"+k]={v:legacy.halaqat[k],ts:1}});
  Object.keys(legacy.visits||{}).forEach(function(k){M["visits/"+k]={v:legacy.visits[k],ts:1}});
  if(legacy.cfg)M.cfg={v:legacy.cfg,ts:1};saveM()}
 legacy=null;rebuild();seed();rebuild()}
function mergeIn(rem){var ch=false;if(!rem)return false;Object.keys(rem).forEach(function(k){var r=rem[k];if(r&&typeof r.ts==="number"&&(!M[k]||r.ts>M[k].ts)){M[k]=r;ch=true}});if(ch){rebuild();saveM();if(!busy[R[0]])render();setTimeout(checkNotify,0)}return ch}
function push(msg){if(FIREBASE_URL){schedule();return}if(isHost)conns.forEach(function(c){try{c.send(msg)}catch(e){}});else if(hostConn&&hostConn.open){try{hostConn.send(msg)}catch(e){}}}
function w(p,v){var e={v:v===null||v===undefined?null:JSON.parse(JSON.stringify(v)),ts:Date.now()},o={};o[p]=e;M[p]=e;rebuild();saveM();push({t:"state",m:o})}
/* ===== حفظ سحابي (Firebase) — كل غرفة تنحفظ بياناتها دائماً ===== */
var stT,ES,syncing=false,again=false;
function curl(){return FIREBASE_URL.replace(/\/+$/,"")+"/jh-rooms/"+encodeURIComponent(P.room)+"/m.json"}
function schedule(){clearTimeout(stT);stT=setTimeout(cloudSync,300)}
function cloudSync(){
 if(!P.room||!FIREBASE_URL)return;if(syncing){again=true;return}syncing=true;
 fetch(curl(),{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
  var rem={};Object.keys(d||{}).forEach(function(k){var e=d[k];if(e&&typeof e.ts==="number")rem[k.replace("~","/")]={v:e.v===undefined?null:e.v,ts:e.ts}});
  mergeIn(rem);
  var up={},n=0;Object.keys(M).forEach(function(k){var r=rem[k];if(!r||M[k].ts>r.ts){up[k.replace("/","~")]=M[k];n++}});
  if(!n)return;
  return fetch(curl(),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(up)}).then(function(r){if(!r.ok)throw 0});
 }).then(function(){setSt("ok","متصل · غرفة "+P.room)}).catch(function(){setSt("err","لا يوجد اتصال — يُرسل عند عودة النت")}).then(function(){syncing=false;if(again){again=false;schedule()}});
}

 });

 my.on("error",function(e){if(e&&e.type==="unavailable-id"){try{my.destroy()}catch(_){}tryClient()}else retry()});
}

 else if(x==="sq"){var td2=today();if(d.k==="month"){SR.from=td2.slice(0,8)+"01";SR.to=td2}else if(d.k==="30"||d.k==="week"){var q2=new Date();q2.setDate(q2.getDate()-(d.k==="week"?6:29));SR.from=ymd(q2);SR.to=td2}else{SR.from="";SR.to=""}render()}
 else if(x==="sprep")printSup();
 else if(x==="srep"){if(!can("task"))return;SR.s=d.id;RM="s";location.hash="#reports";render()}
 else if(x==="notif"){if(!notifOK()){toast("على الآيفون: أضف التطبيق إلى الشاشة الرئيسية أولاً ثم فعّل التنبيهات");return}Notification.requestPermission().then(function(p){render();toast(p==="granted"?"تم تفعيل التنبيهات":"لم يتم السماح بالتنبيهات")})}
 else if(x==="ttype"){F.type=d.k;render()}
 else if(x==="tkind"){F.kind=d.k;render()}
 else if(x==="tsave"){var ty=F.type,hh=S.halaqat[F.hid];if(!can({gen:"task",visit:"vtask"}[ty]))return;if(ty!=="gen"&&!hh){toast("اختر الحلقة المستهدفة");return}if(ty==="visit"&&ak().indexOf(F.kind)<0){toast("اختر جهة الزيارة");return}
  var ti=(F.title||"").trim()||(ty==="visit"?"زيارة "+hh.name:"");if(!ti){toast("اكتب عنوان المهمة");return}if(!(F.to||[]).length){toast("اختر من تُسند إليه المهمة");return}
  if(F.start&&F.due&&F.start>F.due){toast("تاريخ البدء بعد الموعد النهائي");return}
  var t={id:F.id,type:ty,title:ti,desc:(F.desc||"").trim(),hid:hh?hh.id:"",hn:hh?hh.name:"",kind:ty==="visit"?F.kind:"",to:F.to.slice(),by:m.id,byn:m.name,start:F.start||"",due:F.due||"",ts:Date.now(),done:{}};w("tasks/"+t.id,t);F={};location.hash="#t/"+t.id;toast("تم إنشاء المهمة")}
 else if(x==="tdone"){var t1=S.tasks[d.id];if(!t1||!isMine(t1))return;t1=JSON.parse(JSON.stringify(t1));t1.done=t1.done||{};t1.done[m.id]={ts:Date.now(),note:(F.tnote||"").trim()};w("tasks/"+t1.id,t1);F={};render();toast("تم التنفيذ")}
 else if(x==="tundo"){var t2=S.tasks[d.id];if(!t2)return;t2=JSON.parse(JSON.stringify(t2));if(t2.done)delete t2.done[m.id];w("tasks/"+t2.id,t2);render()}
 else if(x==="tdel"){ask("حذف المهمة نهائياً؟",function(){w("tasks/"+d.id,null);location.hash="#tasks"})}
});

if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(function(){});
startSync();render();
